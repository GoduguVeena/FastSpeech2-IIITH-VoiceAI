dataset: IndicTTS_Telugu
path:
  corpus_path: ./data
  lexicon_path: ''
  raw_path: ./raw_data/Telugu
  preprocessed_path: ./preprocessed_data/Telugu
preprocessing:
  val_size: 199
  text:
    text_cleaners: []
    language: te
    tokenization: unicode_character
    vocab_path: ./data/telugu_char_vocab.json
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: phoneme_level
    normalization: true
  energy:
    feature: phoneme_level
    normalization: true
